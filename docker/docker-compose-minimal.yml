version: '3.9'

services:
  # PostgreSQL for Profile Service - essential only
  postgres:
    image: postgres:15-alpine
    container_name: stackfolio-postgres
    environment:
      POSTGRES_DB: profile_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    networks:
      - stackfolio-network
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 96M

  # Profile Service - essential only
  profile-service:
    build:
      context: ../backend
      dockerfile: profile-service/Dockerfile
    container_name: stackfolio-profile-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/profile_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JAVA_OPTS: "-Xms64m -Xmx192m -XX:+UseG1GC -XX:+UseStringDeduplication -XX:MaxGCPauseMillis=200"
    ports:
      - "8081:8081"
    depends_on:
      - postgres
    networks:
      - stackfolio-network
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 192M

  # Frontend - essential only
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: stackfolio-frontend
    environment:
      REACT_APP_API_BASE_URL: http://localhost:8081
    ports:
      - "3000:3000"
    depends_on:
      - profile-service
    networks:
      - stackfolio-network
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 96M

networks:
  stackfolio-network:
    driver: bridge
