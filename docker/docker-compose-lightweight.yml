version: '3.9'

services:
  # PostgreSQL for Profile Service - lightweight
  postgres:
    image: postgres:15-alpine
    container_name: stackfolio-postgres
    environment:
      POSTGRES_DB: profile_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stackfolio-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Redis for caching - lightweight
  redis:
    image: redis:7-alpine
    container_name: stackfolio-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - stackfolio-network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru

  # Profile Service - optimized JVM settings
  profile-service:
    build:
      context: ../backend
      dockerfile: profile-service/Dockerfile
    container_name: stackfolio-profile-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/profile_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:+UseG1GC -XX:+UseStringDeduplication"
    ports:
      - "8081:8081"
    depends_on:
      - postgres
    networks:
      - stackfolio-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # API Gateway - lightweight
  api-gateway:
    build:
      context: ../backend
      dockerfile: api-gateway/Dockerfile
    container_name: stackfolio-api-gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_GATEWAY_ROUTES_0_ID: profile_service
      SPRING_CLOUD_GATEWAY_ROUTES_0_URI: http://profile-service:8081
      SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0: Path=/api/profile/**
      REDIS_HOST: redis
      JAVA_OPTS: "-Xms64m -Xmx128m -XX:+UseG1GC"
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - profile-service
    networks:
      - stackfolio-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Frontend - lightweight
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: stackfolio-frontend
    environment:
      REACT_APP_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - stackfolio-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

networks:
  stackfolio-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
