spring:
  application:
    name: interaction-service
  
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
    topics:
      contact-message: contact-message-topic
  
  redis:
    host: redis
    port: 6379

server:
  port: 8083
  servlet:
    context-path: /
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

ratelimit:
  contact-form:
    max-requests: 10
    window-minutes: 1

logging:
  level:
    com.stackfolio: DEBUG
    org.springframework.web: DEBUG
    org.springframework.kafka: DEBUG
