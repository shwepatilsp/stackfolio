spring:
  application:
    name: profile-service
  
  datasource:
    url: jdbc:postgresql://postgres:5432/profile_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: true
    show-sql: false
  
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8081
  servlet:
    context-path: /
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.stackfolio: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
