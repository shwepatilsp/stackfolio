spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: profile_service
          uri: http://profile-service:8081
          predicates:
            - Path=/api/profile/**
        
        - id: project_service
          uri: http://project-service:8082
          predicates:
            - Path=/api/projects/**
        
        - id: interaction_service
          uri: http://interaction-service:8083
          predicates:
            - Path=/api/contact/**
      
      default-filters:
        - RemoveRequestHeader=X-Request-Id
  
  redis:
    host: redis
    port: 6379
    timeout: 60000ms
  
  security:
    user:
      name: admin
      password: admin123
    jwt:
      secret: ${JWT_SECRET:stackfolio-secret-key-for-jwt-please-change-in-production}
      expiration: 86400000

server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.stackfolio: DEBUG
    org.springframework.security: DEBUG
    org.springframework.cloud.gateway: DEBUG
